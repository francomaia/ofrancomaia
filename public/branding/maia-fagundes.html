<script>
(() => {
  const t = document.getElementById('track');
  const cur = t.querySelector('.current');
  if (cur) t.scrollLeft = cur.offsetLeft - t.offsetLeft - (t.clientWidth - cur.clientWidth) / 2;
  document.querySelectorAll('.arrows button').forEach(b => b.addEventListener('click', () => {
    t.scrollBy({ left: Number(b.dataset.dir) * t.clientWidth * 0.8, behavior: 'smooth' });
  }));
  // pré-carrega a página do projeto quando o cursor passa pelo card
  const seen = new Set();
  t.querySelectorAll('a.card:not(.current)').forEach(a => a.addEventListener('pointerenter', () => {
    if (seen.has(a.href)) return; seen.add(a.href);
    const l = document.createElement('link'); l.rel = 'prefetch'; l.href = a.href; document.head.appendChild(l);
  }, { once: true }));
  
})();
</script>
